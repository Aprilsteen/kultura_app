<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' data: gap: https://ssl.gstatic.com https://kultura-doma.ru 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="css/offline.css">
    <title>Культура дома</title>
    <style>
        /* Стили для iframe */
        #site-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 1000;
            background: white;
        }
        
        body.mode-online #site-frame {
            display: block;
        }
        
        /* Ваши существующие стили остаются */
    </style>
</head>
<body class="mode-offline" id="body">
    <!-- CORDOVA -->
    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <!-- // -->
    
    <!-- Офлайн-экран (ваш существующий) -->
    <div class="wrapper wrapper-offline">
        <!-- весь ваш существующий HTML офлайн-экрана -->
    </div>
    
    <!-- iframe для сайта -->
    <iframe id="site-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-presentation allow-top-navigation"></iframe>
</body>
</html>
